<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#071013">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>타로 러브카드 · Tarot LoveCard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital@0;1&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#151033; --night-2:#241C4A;
    --gold:#E0BC63; --gold-2:#F3E0A6; --gold-deep:#9A7524; --gold-line:#B99236;
    --parch:#F7EDD4; --parch-2:#ECDCB2;
    --ink:#332310;     /* primary body text on parchment (high contrast) */
    --ink-2:#6A5228;   /* secondary body text (readable brown) */
    --ok:#3C8A6A; --no:#B0574F;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; }
  body{ font-family:'Cormorant Garamond',serif; color:var(--gold-2); min-height:100dvh;
    display:flex; flex-direction:column; align-items:center; padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(40px + env(safe-area-inset-bottom,0px));
    background:
      radial-gradient(2px 2px at 15% 18%, rgba(243,224,166,.6), transparent),
      radial-gradient(1.5px 1.5px at 80% 12%, rgba(243,224,166,.5), transparent),
      radial-gradient(1.5px 1.5px at 30% 78%, rgba(243,224,166,.4), transparent),
      radial-gradient(2px 2px at 88% 68%, rgba(243,224,166,.4), transparent),
      radial-gradient(1.5px 1.5px at 55% 40%, rgba(243,224,166,.35), transparent),
      radial-gradient(135% 100% at 50% -5%, #322A5C 0%, #1B1540 45%, var(--night) 100%);
    background-attachment:fixed; }

  header{ text-align:center; margin:2px 0 12px; }
  .brand{ font-family:'Nanum Myeongjo',serif; font-weight:800; font-size:clamp(23px,6.4vw,27px); letter-spacing:2px; color:var(--gold-2); text-shadow:0 1px 0 var(--gold-deep), 0 0 16px rgba(224,188,99,.3); }
  .brand .em{ color:var(--gold); }
  .sub{ margin-top:4px; font-family:'Cinzel',serif; font-size:9.5px; letter-spacing:2.5px; color:var(--gold); opacity:.85; text-transform:uppercase; }

  .modebar{ display:inline-flex; gap:8px; margin:4px 0 14px; }
  .modebar button{ cursor:pointer; font-family:'Cinzel',serif; font-size:12px; letter-spacing:2px; text-transform:uppercase; padding:9px 22px; border:1px solid var(--gold-line); background:rgba(36,28,74,.6); color:var(--gold-2); border-radius:3px; transition:.2s; }
  .modebar button[aria-pressed="true"]{ background:linear-gradient(180deg,var(--gold-2),var(--gold)); color:#2a2008; border-color:var(--gold-2); box-shadow:0 0 14px rgba(224,188,99,.45); }

  .lang-wrap{ text-align:center; margin:2px 0 14px; }
  .lang-label{ font-family:'Cinzel',serif; font-size:11px; letter-spacing:2px; color:var(--gold-2); opacity:.9; margin-bottom:8px; }
  .segment{ display:inline-flex; gap:6px; }
  .segment button{ border:1px solid var(--gold-line); background:rgba(36,28,74,.65); cursor:pointer; padding:8px 16px; font-family:'Cinzel',serif; font-size:12px; letter-spacing:1px; color:var(--gold-2); transition:.2s; border-radius:3px; }
  .segment button[aria-pressed="true"]{ background:linear-gradient(180deg,var(--gold-2),var(--gold)); color:#2a2008; border-color:var(--gold-2); box-shadow:0 0 12px rgba(224,188,99,.45); }

  /* card / deck */
  .stage{ perspective:1400px; }
  .deck{ position:relative; width:min(300px,88vw); margin:0 auto; }
  .deck::before,.deck::after{ content:""; position:absolute; inset:0; border-radius:16px;
    background:repeating-linear-gradient(45deg, rgba(224,188,99,.07) 0 6px, transparent 6px 12px), radial-gradient(circle at 50% 50%, #2d2560, #191340);
    border:2px solid var(--gold-line); box-shadow:0 14px 30px rgba(0,0,0,.5), inset 0 0 0 5px rgba(224,188,99,.12); }
  .deck::before{ transform:translate(10px,11px) rotate(3.5deg); }
  .deck::after{ transform:translate(5px,5px) rotate(-2.2deg); }
  .panel, .card{ background:radial-gradient(120% 90% at 50% 0%, #FCF4DE, var(--parch) 55%, var(--parch-2) 100%);
    border:2px solid var(--gold-line); border-radius:16px; box-shadow:0 16px 34px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.5); }
  .card{ position:relative; z-index:3; width:100%; padding:12px 13px 14px; display:flex; flex-direction:column; cursor:pointer; user-select:none; overflow:hidden; transition:transform .17s ease, box-shadow .25s; transform-style:preserve-3d; }
  .card.flip{ transform:rotateY(90deg) scale(.97); }
  .card:active{ transform:translateY(2px) scale(.996); }
  .card::before{ content:""; position:absolute; inset:8px; border-radius:10px; border:1.5px solid var(--gold-line); box-shadow:inset 0 0 0 3px rgba(224,188,99,.22); pointer-events:none; }
  .card > *{ position:relative; z-index:1; }
  .card-top{ display:flex; align-items:center; justify-content:space-between; padding:2px 6px 0; }
  .suit{ font-size:17px; color:var(--gold-deep); width:22px; text-align:center; }
  .numeral{ font-family:'Cinzel',serif; font-weight:700; font-size:14px; letter-spacing:2px; color:var(--ink); }
  .numeral::before,.numeral::after{ content:"·"; color:var(--gold-deep); margin:0 5px; }

  .art-frame{ margin:8px auto 6px; width:clamp(150px,46vw,178px); aspect-ratio:1 / 1.03; border:2px solid var(--gold-line); border-radius:50% 50% 10px 10px / 46% 46% 8px 8px;
    background:radial-gradient(120% 100% at 50% 20%, #FFFCF0, #F1E3BC); box-shadow:inset 0 0 0 3px rgba(224,188,99,.28), inset 0 6px 16px rgba(154,117,36,.14);
    display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .art-frame.sm{ width:clamp(120px,38vw,146px); }
  .art{ width:72%; height:72%; }
  .back-q{ font-family:'Cinzel',serif; font-size:clamp(38px,11vw,46px); color:var(--gold-deep); }
  .art .s{ fill:none; stroke:var(--gold-deep); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
  .art .s2{ fill:none; stroke:var(--gold-deep); stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; opacity:.92; }
  .art .fill{ fill:var(--gold-deep); stroke:none; }

  .orig{ text-align:center; font-family:'Cormorant Garamond',serif; font-style:italic; font-size:clamp(12px,3.4vw,13px); color:var(--ink-2); margin:1px 6px 0; line-height:1.25; }
  .arcana{ text-align:center; font-family:'Cinzel',serif; font-size:clamp(9.5px,2.7vw,10.5px); letter-spacing:2px; color:var(--ink-2); text-transform:uppercase; margin:4px 0 3px; }
  .arcana .kcat{ color:var(--ink); font-weight:700; }
  .lines{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:2px; padding:0 4px; }
  .line{ text-align:center; padding:1px 2px; }
  .line .txt{ line-height:1.16; word-break:keep-all; color:var(--ink); }
  .lang-ko .txt{ font-family:'Nanum Myeongjo',serif; font-weight:800; }
  .lang-zh .txt{ font-family:'Noto Serif SC',serif; font-weight:700; }
  .lang-en .txt{ font-family:'Cinzel',serif; font-weight:700; letter-spacing:.3px; text-transform:uppercase; }
  .line.primary .txt{ font-size:clamp(18px,5.4vw,22px); }
  .line.primary.lang-en .txt{ font-size:clamp(15px,4.4vw,17px); }
  .lines.lit .line.primary .txt{ font-size:clamp(14px,4.2vw,16px); }
  .lines.lit .line.primary.lang-en .txt{ font-size:clamp(12.5px,3.6vw,14px); }
  .line.secondary .txt{ font-size:clamp(12.5px,3.6vw,14px); color:var(--ink-2); }
  .line.secondary.lang-en .txt{ font-size:clamp(11.5px,3.2vw,12.5px); }
  .lines.lit .line.secondary .txt{ font-size:clamp(11.5px,3.2vw,12.5px); }
  .pron{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:clamp(11.5px,3.2vw,12.5px); color:var(--ink-2); }
  .line.primary .pron{ display:none; }
  .credit{ text-align:center; font-family:'Cinzel',serif; font-size:clamp(9px,2.6vw,10px); letter-spacing:1.2px; color:var(--ink-2); text-transform:uppercase; margin-top:5px; }
  .fav{ position:absolute; z-index:4; right:13px; bottom:11px; width:34px; height:34px; border-radius:50%; cursor:pointer; border:1.5px solid var(--gold-line); background:rgba(255,252,240,.9); color:var(--gold-deep); font-size:16px; display:flex; align-items:center; justify-content:center; transition:transform .15s; }
  .fav:active{ transform:scale(.85); }
  .fav.on{ background:linear-gradient(180deg,var(--gold-2),var(--gold)); color:#3a2a08; }

  .draw{ margin-top:20px; cursor:pointer; font-family:'Cinzel',serif; font-size:15px; letter-spacing:3px; text-transform:uppercase; color:#2a2008; padding:14px 32px; border:0; border-radius:4px; background:linear-gradient(180deg,var(--gold-2),var(--gold)); box-shadow:0 5px 0 var(--gold-deep), 0 10px 22px rgba(224,188,99,.32); transition:.1s; }
  .draw:active{ transform:translateY(4px); box-shadow:0 1px 0 var(--gold-deep); }
  .cats{ display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin:22px 0 4px; max-width:380px; }
  .cats button{ cursor:pointer; font-family:'Cinzel',serif; font-size:11px; letter-spacing:.5px; padding:8px 12px; border-radius:3px; color:var(--gold-2); background:rgba(36,28,74,.6); border:1px solid var(--gold-line); transition:.15s; }
  .cats button .g{ margin-right:5px; opacity:.9; }
  .cats button[aria-pressed="true"]{ background:linear-gradient(180deg,var(--gold-2),var(--gold)); color:#2a2008; border-color:var(--gold-2); box-shadow:0 0 12px rgba(224,188,99,.4); }
  .tray{ margin-top:26px; width:100%; max-width:360px; }
  .tray h2{ font-family:'Cinzel',serif; font-size:12px; letter-spacing:2px; color:var(--gold-2); text-transform:uppercase; display:flex; align-items:center; justify-content:center; gap:8px; margin:0 0 12px; }
  .tray h2::before,.tray h2::after{ content:""; flex:1; height:1px; background:linear-gradient(90deg,transparent,var(--gold-line)); }
  .tray h2::after{ background:linear-gradient(90deg,var(--gold-line),transparent); }
  .empty{ font-style:italic; font-size:14px; color:var(--gold-2); opacity:.7; text-align:center; border:1px dashed var(--gold-line); border-radius:8px; padding:16px; }
  .fav-item{ display:flex; align-items:center; gap:10px; cursor:pointer; background:rgba(36,28,74,.6); border:1px solid var(--gold-line); border-radius:6px; padding:9px 11px; margin-bottom:8px; }
  .fav-item .fn{ font-family:'Cinzel',serif; font-size:11px; color:var(--gold); width:34px; text-align:center; }
  .fav-item .ft{ flex:1; min-width:0; }
  .fav-item .a{ font-family:'Nanum Myeongjo',serif; font-weight:700; font-size:15px; color:var(--gold-2); }
  .fav-item .b{ font-size:13px; color:var(--gold); opacity:.75; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fav-item .rm{ border:1px solid var(--gold-line); background:transparent; color:var(--gold-2); border-radius:4px; padding:6px 9px; cursor:pointer; font-family:'Cinzel',serif; font-size:10px; }

  /* game */
  #gameView{ width:100%; max-width:340px; display:flex; flex-direction:column; align-items:center; }
  .g-panel{ width:100%; padding:20px 18px; text-align:center; }
  .g-title{ font-family:'Nanum Myeongjo',serif; font-weight:800; font-size:19px; color:var(--ink); margin-bottom:14px; }
  .g-sec{ font-family:'Cinzel',serif; font-size:10px; letter-spacing:2px; color:var(--ink-2); text-transform:uppercase; margin:15px 0 8px; }
  .g-seg{ display:inline-flex; gap:5px; flex-wrap:wrap; justify-content:center; }
  .g-seg button{ border:1px solid var(--gold-line); background:#fff8; cursor:pointer; padding:7px 12px; font-family:'Cinzel',serif; font-size:11px; color:var(--ink); border-radius:3px; }
  .g-seg button[aria-pressed="true"]{ background:linear-gradient(180deg,var(--gold-2),var(--gold)); color:#2a2008; border-color:var(--gold-deep); }
  .g-diffnote{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:13.5px; color:var(--ink-2); margin-top:8px; }
  .g-toggle{ margin-top:12px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; font-family:'Cinzel',serif; font-size:11px; color:var(--ink); border:1px solid var(--gold-line); border-radius:3px; padding:9px 13px; background:#fff8; }
  .g-toggle .box{ width:16px; height:16px; border:1px solid var(--gold-deep); display:inline-flex; align-items:center; justify-content:center; color:#2a2008; font-size:12px; border-radius:2px; }
  .g-toggle[aria-pressed="true"] .box{ background:linear-gradient(180deg,var(--gold-2),var(--gold)); }
  .g-langrow{ display:flex; align-items:center; justify-content:space-between; margin:9px 0; }
  .g-langrow > span{ font-family:'Cinzel',serif; font-size:11px; letter-spacing:.5px; color:var(--ink-2); }
  .g-vs{ color:var(--gold-deep); font-size:15px; margin:1px 0; }
  .g-link{ display:inline-block; margin-top:14px; background:none; border:0; cursor:pointer; font-family:'Cormorant Garamond',serif; font-size:14px; color:var(--gold-deep); text-decoration:underline; }
  .g-note{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:13.5px; color:var(--ink-2); margin-top:14px; line-height:1.5; }
  .g-turnbar{ font-family:'Cinzel',serif; font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--gold-2); background:rgba(36,28,74,.7); border:1px solid var(--gold-line); border-radius:4px; padding:10px 14px; margin-bottom:14px; text-align:center; width:100%; }
  .g-turnbar.ok{ color:#eafff5; background:rgba(40,110,84,.75); border-color:var(--ok); }
  .g-turnbar.no{ color:#fff0ee; background:rgba(140,70,64,.7); border-color:var(--no); }
  .g-turnbar b{ color:var(--gold); } .g-turnbar.ok b,.g-turnbar.no b{ color:#fff; }
  .speak-line{ margin:2px 6px 4px; }
  .speak-line .txt{ line-height:1.18; color:var(--ink); word-break:keep-all; }
  .speak-line.lang-ko .txt{ font-family:'Nanum Myeongjo',serif; font-weight:800; font-size:clamp(19px,5.6vw,22px); }
  .speak-line.lang-zh .txt{ font-family:'Noto Serif SC',serif; font-weight:700; font-size:clamp(19px,5.6vw,22px); }
  .speak-line.lang-en .txt{ font-family:'Cinzel',serif; font-weight:700; font-size:clamp(15px,4.4vw,17px); text-transform:uppercase; }
  .speak-line.lit .txt{ font-size:clamp(15px,4.4vw,17px); }
  .speak-line .pron{ font-style:italic; font-size:13px; color:var(--ink-2); margin-top:3px; }
  .speak-hint{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:14px; color:var(--ink-2); margin:6px 0 2px; }
  .g-options{ width:100%; display:flex; flex-direction:column; gap:8px; margin-top:4px; }
  .g-opt{ cursor:pointer; text-align:center; padding:13px 12px; border:1.5px solid var(--gold-line); border-radius:7px; background:radial-gradient(120% 100% at 50% 0%, #FCF4DE, var(--parch)); color:var(--ink); transition:.15s; }
  .g-opt.ko{ font-family:'Nanum Myeongjo',serif; font-weight:700; font-size:clamp(15px,4.4vw,16px); }
  .g-opt.zh{ font-family:'Noto Serif SC',serif; font-weight:700; font-size:clamp(15px,4.4vw,16px); }
  .g-opt.en{ font-family:'Cinzel',serif; font-weight:700; font-size:clamp(12.5px,3.6vw,13px); text-transform:uppercase; }
  .g-opt:active{ transform:scale(.98); background:linear-gradient(180deg,#fff,var(--parch)); }
  .timer-wrap{ width:100%; margin:2px 0 10px; }
  .tbar{ height:7px; border:1px solid var(--gold-line); border-radius:4px; overflow:hidden; background:rgba(36,28,74,.5); }
  .tfill{ height:100%; width:100%; background:linear-gradient(90deg,var(--gold),var(--no)); }
  .tnum{ text-align:center; font-family:'Cinzel',serif; font-size:11px; letter-spacing:1px; color:var(--gold-2); margin-top:4px; }
  .hearts{ margin-top:14px; font-size:20px; letter-spacing:4px; color:var(--gold); }
  .hearts .off{ color:var(--gold-2); opacity:.3; }
  .hearts.big{ font-size:26px; margin:6px 0 10px; }
  .g-btn{ margin-top:15px; cursor:pointer; font-family:'Cinzel',serif; font-size:14px; letter-spacing:2px; text-transform:uppercase; color:#2a2008; padding:13px 28px; border:0; border-radius:4px; background:linear-gradient(180deg,var(--gold-2),var(--gold)); box-shadow:0 4px 0 var(--gold-deep), 0 9px 18px rgba(224,188,99,.28); transition:.1s; width:100%; max-width:290px; }
  .g-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--gold-deep); }
  .g-btn.ghost{ background:transparent; color:var(--gold-2); border:1px solid var(--gold-line); box-shadow:none; }
  .r-title{ font-family:'Nanum Myeongjo',serif; font-weight:800; font-size:24px; color:var(--ink); margin-bottom:4px; }
  .r-en{ font-family:'Cinzel',serif; font-size:11px; letter-spacing:2px; color:var(--ink-2); text-transform:uppercase; }
  .r-score{ font-family:'Cormorant Garamond',serif; font-size:16px; color:var(--ink-2); margin-top:8px; }
  .r-sub{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:15px; color:var(--ink); margin-top:6px; line-height:1.5; }

  /* tutorial overlay */
  .tut-overlay{ position:fixed; inset:0; z-index:50; background:rgba(15,11,35,.86); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; padding:22px; }
  .tut-card{ width:100%; max-width:330px; padding:24px 22px 20px; text-align:center; }
  .tut-glyph{ font-size:52px; line-height:1; margin-bottom:6px; }
  .tut-badge{ font-family:'Cinzel',serif; font-size:10px; letter-spacing:2px; color:var(--gold-deep); text-transform:uppercase; }
  .tut-title{ font-family:'Nanum Myeongjo',serif; font-weight:800; font-size:21px; color:var(--ink); margin:8px 0 8px; }
  .tut-body{ font-family:'Cormorant Garamond',serif; font-size:16px; color:var(--ink-2); line-height:1.55; min-height:78px; }
  .tut-dots{ display:flex; gap:7px; justify-content:center; margin:14px 0 4px; }
  .tut-dots i{ width:8px; height:8px; border-radius:50%; background:var(--gold-line); opacity:.4; }
  .tut-dots i.on{ opacity:1; background:var(--gold-deep); transform:scale(1.15); }
  .tut-btns{ display:flex; gap:10px; margin-top:12px; }
  .tut-btns .g-btn{ margin-top:0; }

  footer{ margin-top:26px; font-style:italic; font-size:13px; color:var(--gold-2); opacity:.6; text-align:center; max-width:340px; }
  /* shadow / omen cards */
  .art-frame.omen{ background:radial-gradient(120% 100% at 50% 20%, #F4EDF1, #E3D4DD); border-color:#8A6C82; box-shadow:inset 0 0 0 3px rgba(124,92,116,.25), inset 0 6px 16px rgba(90,60,80,.14); }
  .art.omen .s, .art.omen .s2{ stroke:#7C5C72; } .art.omen .fill{ fill:#7C5C72; }
  .card.omen .suit{ color:#7C5C72; }
  .card.omen::before{ border-color:#8A6C82; box-shadow:inset 0 0 0 3px rgba(124,92,116,.2); }
  .panel.omen .suit{ color:#7C5C72; }
  .hidden{ display:none !important; }
  .topnav{ width:100%; max-width:360px; margin-bottom:6px; }
  .topnav a{ display:inline-block; font-family:'Nanum Myeongjo',serif; font-weight:700; font-size:15px; color:var(--gold-2); text-decoration:none; border:1px solid var(--gold-line); background:rgba(36,28,74,.6); border-radius:3px; padding:8px 12px; }
  .sync{ font-family:'Nanum Myeongjo',serif; font-size:13px; line-height:1.5; color:var(--gold-2); opacity:.8; text-align:center; margin:10px 4px 0; }
  .sync.bad{ color:#F0B3A8; opacity:1; font-weight:700; }
  @media (prefers-reduced-motion: reduce){ .card,.card.flip,.draw,.fav,.g-btn{ transition:none !important; } }

  /* ===== 호프 색감: 숲의 어둠 + 기름막 무지갯빛 ===== */
  :root{
    --night:#071013; --night-2:#121915;
    --gold:#9FD7C9; --gold-2:#E4ECE7; --gold-deep:#D6E6DF; --gold-line:rgba(190,215,205,.2);
    --parch:#16211D; --parch-2:#0D1512;
    --ink:#E4ECE7; --ink-2:#93A89F;
    --iri:linear-gradient(120deg,#E7C96F 0%,#D98A52 18%,#C774B8 38%,#7C72DA 58%,#4FA6C8 80%,#9FD7C9 100%);
    --on-iri:#071013; --ok:#4FB892; --no:#D9677E;
  }
  body{ background:radial-gradient(120% 60% at 50% 0%, #0F2124 0%, #0B1613 45%, #071013 100%); background-attachment:fixed; color:var(--ink); }
  body::before{ content:""; position:fixed; inset:0; pointer-events:none; opacity:.07; z-index:0;

  /* 상단 한 줄: 돌아가기 + 모드 */
  .bar{ width:100%; max-width:360px; display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .back{ width:42px; height:42px; display:flex; align-items:center; justify-content:center; border-radius:50%; border:1px solid var(--gold-line); color:var(--ink); text-decoration:none; font-size:20px; }
  .modebar{ margin:0; gap:4px; padding:3px; border:1px solid var(--gold-line); border-radius:999px; }
  .modebar button{ border:0; background:transparent; color:var(--ink-2); border-radius:999px; padding:8px 18px; font-family:'Nanum Myeongjo',serif; font-weight:700; font-size:14px; letter-spacing:0; }
  .modebar button[aria-pressed="true"]{ background:var(--iri); color:var(--on-iri); box-shadow:none; }

  /* 감상 컨트롤 한 줄: 언어 + 분류 */
  .ctrl{ width:100%; max-width:360px; display:flex; gap:8px; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .segment{ gap:0; padding:3px; border:1px solid var(--gold-line); border-radius:999px; }
  .segment button{ border:0; background:transparent; color:var(--ink-2); border-radius:999px; padding:7px 13px; font-family:'Nanum Myeongjo',serif; font-weight:700; font-size:14px; }
  .segment button[aria-pressed="true"]{ background:var(--iri); color:var(--on-iri); box-shadow:none; border:0; }
  .cat-sel{ appearance:none; -webkit-appearance:none; font-family:'Nanum Myeongjo',serif; font-weight:700; font-size:14px; color:var(--ink); background:transparent; border:1px solid var(--gold-line); border-radius:999px; padding:9px 30px 9px 14px; max-width:48%;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%); background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%; background-size:5px 5px; background-repeat:no-repeat; }
  .cat-sel option{ background:#0D1512; color:var(--ink); }

  /* 카드 · 패널 */
  .deck::before,.deck::after{ display:none; }
  .panel,.card{ background:linear-gradient(180deg,#17231F,#0C1411); border:1px solid var(--gold-line); box-shadow:0 20px 44px rgba(0,0,0,.55); }
  .card{ border:1.5px solid transparent; background:linear-gradient(180deg,#17231F,#0C1411) padding-box, var(--iri) border-box; padding:16px 14px 18px; }
  .card::before{ display:none; }
  #card .suit, #card .arcana{ display:none; }
  #card .card-top{ justify-content:center; }
  .numeral{ color:var(--ink-2); font-size:12px; }
  .numeral::before,.numeral::after{ color:var(--gold-line); }
  .art-frame{ background:radial-gradient(circle at 50% 35%, #1D3531, #0B1513); border:1px solid var(--gold-line); box-shadow:none; }
  .art .s,.art .s2{ stroke:var(--gold-deep); } .art .fill{ fill:var(--gold-deep); }
  .back-q{ color:var(--gold-deep); }
  .orig,.arcana,.credit,.pron{ color:var(--ink-2); }
  .arcana .kcat{ color:var(--ink); }
  .line .txt,.speak-line .txt{ color:var(--ink); }
  .line.secondary .txt{ color:var(--ink-2); }
  .fav{ background:rgba(7,16,19,.75); border:1px solid var(--gold-line); color:var(--ink); }
  .fav.on{ background:var(--iri); color:var(--on-iri); border-color:transparent; }

  /* 그림자 · 경고 카드 */
  .art-frame.omen{ background:radial-gradient(circle at 50% 35%, #2B1E30, #120E15); border-color:rgba(199,116,184,.4); box-shadow:none; }
  .art.omen .s,.art.omen .s2{ stroke:#E3A6CF; } .art.omen .fill{ fill:#E3A6CF; }
  .card.omen .suit,.panel.omen .suit{ color:#E3A6CF; }

  /* 즐겨찾기 */
  .tray{ margin-top:22px; }
  .tray h2{ font-family:'Nanum Myeongjo',serif; font-size:14px; letter-spacing:0; color:var(--ink-2); }
  .empty{ border:0; padding:6px; font-family:'Nanum Myeongjo',serif; font-style:normal; font-size:14px; color:var(--ink-2); }
  .fav-item{ background:rgba(255,255,255,.035); border:1px solid var(--gold-line); border-radius:10px; }
  .fav-item .fn{ color:var(--ink-2); }
  .fav-item .a{ color:var(--ink); } .fav-item .b{ color:var(--ink-2); opacity:1; }
  .fav-item .rm{ border-color:var(--gold-line); color:var(--ink-2); border-radius:999px; padding:6px 11px; font-family:'Nanum Myeongjo',serif; }
  .sync:empty{ display:none; }
  .sync.bad{ color:#F2A7B6; }

  /* 게임 */
  .g-title,.r-title,.tut-title{ color:var(--ink); }
  .g-sec,.g-diffnote,.g-langrow > span,.g-note,.r-en,.r-score,.speak-hint,.tut-body{ color:var(--ink-2); }
  .r-sub{ color:var(--ink); }
  .g-seg button,.g-toggle{ background:transparent; border:1px solid var(--gold-line); color:var(--ink); border-radius:999px; }
  .g-seg button[aria-pressed="true"]{ background:var(--iri); color:var(--on-iri); border-color:transparent; }
  .g-toggle .box{ border-color:var(--ink-2); border-radius:50%; color:var(--on-iri); }
  .g-toggle[aria-pressed="true"] .box{ background:var(--iri); border-color:transparent; }
  .g-vs,.g-link,.tut-badge{ color:var(--gold); }
  .g-turnbar{ background:rgba(255,255,255,.04); border:1px solid var(--gold-line); color:var(--ink); border-radius:999px; font-family:'Nanum Myeongjo',serif; letter-spacing:0; text-transform:none; font-size:14px; }
  .g-turnbar b{ color:var(--gold); }
  .g-turnbar.ok{ background:rgba(79,184,146,.18); border-color:var(--ok); color:#DDF5EC; }
  .g-turnbar.no{ background:rgba(217,103,126,.16); border-color:var(--no); color:#FBE3E8; }
  .g-opt{ background:rgba(255,255,255,.035); border:1px solid var(--gold-line); color:var(--ink); border-radius:12px; }
  .g-opt:active{ background:rgba(255,255,255,.09); }
  .tbar{ background:rgba(255,255,255,.06); border-color:var(--gold-line); }
  .tfill{ background:var(--iri); }
  .tnum{ color:var(--ink-2); }
  .hearts{ color:#D98AC6; } .hearts .off{ color:var(--ink-2); }
  .g-btn{ background:var(--iri); color:var(--on-iri); box-shadow:none; border-radius:999px; font-family:'Nanum Myeongjo',serif; font-weight:800; letter-spacing:0; text-transform:none; }
  .g-btn:active{ box-shadow:none; }

  footer{ color:var(--ink-2); opacity:1; font-family:'Nanum Myeongjo',serif; font-style:normal; }
  footer:empty{ display:none; }

  <div class="bar">
    <a class="back" href="/" aria-label="몰리로 돌아가기">←</a>

      <button data-mode="game" aria-pressed="false">게임</button>

  </div>

  <div id="browseView">
    <div class="ctrl">

          <div class="arcana" id="arcana"></div>
          <div class="lines" id="lines"></div>
          <div class="credit" id="credit"></div>
          <button class="fav" id="fav" aria-label="즐겨찾기">♡</button>
        </div>
      </div>
    </div>
    <div class="tray"><h2>즐겨찾기</h2><div id="favList"></div><div class="sync" id="sync"></div></div>
  </div>

  <div id="gameView" class="hidden"><div id="gameStage"></div></div>

  <div id="tut" class="tut-overlay hidden">
    <div class="tut-card panel">
      <div class="tut-glyph" id="tutGlyph">📱</div>

      <div class="tut-title" id="tutTitle"></div>
      <div class="tut-body" id="tutBody"></div>
      <div class="tut-dots" id="tutDots"></div>
      <div class="tut-btns">
        <button class="g-btn ghost" id="tutSkip">건너뛰기</button>
        <button class="g-btn" id="tutNext">다음</button>
      </div>
    </div>
  </div>

  <footer id="foot"></footer>

const el=id=>document.getElementById(id);
const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const LANGS=['ko','zh','en']; const LANGLBL={ko:'한국어',zh:'中文',en:'English'};
function toRoman(n){const m=[[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let r='';for(const[v,s]of m){while(n>=v){r+=s;n-=v;}}return r;}
function cardData(c,num){return{cat:c[0],sym:c[1],num,roman:toRoman(num),ko:{txt:c[2],pron:c[3]},zh:{txt:c[4],pron:c[5]},en:{txt:c[6],pron:''},source:c[7]||'',orig:c[8]||'',arc:c[9]||'',lit:LIT.includes(c[0]),omen:OMEN.includes(c[0]),id:c[2]+'|'+c[4]};}
const CARDS=DECK.map((c,i)=>cardData(c,i+1));
function sample(arr,n,exclude){const p=arr.filter(x=>!exclude.includes(x));const o=[];while(o.length<n&&p.length){o.push(p.splice(Math.floor(Math.random()*p.length),1)[0]);}return o;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

const DIFFS={ '쉬움':{opt:3,time:0,hide:false,same:false,desc:'보기 3개'},
  '보통':{opt:4,time:0,hide:false,same:false,desc:'보기 4개'},
  '어려움':{opt:5,time:12,hide:true,same:true,desc:'보기 5개 · 그림 숨김 · 12초 · 헷갈리는 오답'} };

const TUT=[
  {g:'📱',t:'폰 하나로 함께',b:'두 사람이 폰 하나를 주고받으며 번갈아 해요. 시작 전에 각자 “먼저 읽을 언어”를 골라요.'},
  {g:'🎭',t:'① 읽어주기',b:'카드를 뽑은 사람이 자기 언어로 소리 내어 읽어줘요. 희곡 대사는 연기하듯 읽으면 더 재밌어요.'},
  {g:'✨',t:'② 맞히기',b:'상대는 타로 그림을 힌트 삼아, 보기 중에서 뜻을 골라요. 어려움에선 그림이 가려지고 제한시간이 생겨요.'},
  {g:'♥',t:'③ 궁합',b:'뜻이 통할 때마다 하트 한 개! 여섯 장을 넘기면 오늘의 궁합이 나와요. 서로의 언어도 자연스럽게 배워요.'},
];

const S={ mode:'browse', primary:'ko', filter:'전체', current:null, favs:[],
  gp:{1:'ko',2:'zh'}, diff:'보통', litOn:true, total:6,
  round:0, speaker:1, hearts:0, gcard:null, gview:'setup', options:[], picked:null, timer:null,
  tutStep:0, tutSeen:false };

/* ---------- 저장: 설정은 이 기기, 즐겨찾기는 곰의 굴(없으면 이 기기) ---------- */
const LC_PREFS='lovecard-prefs', LC_FAVS='lovecard-favs';
const CODE_OK=/^(?:[A-HJ-NP-Z2-9]{8}|[A-HJ-NP-Z2-9]{16})$/;
function lsG(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsS(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
const CAVE=(()=>{ const c=lsG('molly-code'); return c&&CODE_OK.test(c)?c:null; })();
(function loadPrefs(){ try{ const p=JSON.parse(lsG(LC_PREFS)||'null'); if(!p) return;
  if(LANGS.includes(p.primary)) S.primary=p.primary;
  if(p.gp && LANGS.includes(p.gp[1]) && LANGS.includes(p.gp[2])) S.gp={1:p.gp[1],2:p.gp[2]};
  if(DIFFS[p.diff]) S.diff=p.diff;
  if(typeof p.litOn==='boolean') S.litOn=p.litOn;
  S.tutSeen=!!p.tutSeen; }catch(e){} })();
function savePrefs(){ lsS(LC_PREFS, JSON.stringify({primary:S.primary,gp:S.gp,diff:S.diff,litOn:S.litOn,tutSeen:S.tutSeen})); }
function idsToCards(ids){ return (Array.isArray(ids)?ids:[]).map(id=>CARDS.find(c=>c.id===id)).filter(Boolean); }
function saveLocalFavs(){ lsS(LC_FAVS, JSON.stringify(S.favs.map(f=>f.id))); }
function loadLocalFavs(){ try{ S.favs=idsToCards(JSON.parse(lsG(LC_FAVS)||'[]')); }catch(e){ S.favs=[]; } }
const SYNC_NOTE = CAVE ? '♥ 즐겨찾은 카드는 곰의 굴에 저장돼 둘이 함께 봐요' : '지금은 이 기기에만 저장돼요. 몰리에서 굴에 들어가면 둘이 함께 볼 수 있어요.';
function setSync(msg,bad){ const s=el('sync'); if(!s) return; s.textContent=msg||''; s.className='sync'+(bad?' bad':''); }
function applyRoomFavs(room){ S.favs=idsToCards(room&&room.favs); saveLocalFavs(); renderFavs(); if(S.current) renderCard(); }
async function pullFavs(){ if(!CAVE) return;
  try{ const r=await fetch('/api/room?code='+CAVE,{cache:'no-store'}); if(!r.ok) throw new Error(r.status);
    applyRoomFavs((await r.json()).room); setSync(''); }
  catch(e){ setSync('굴에 연결하지 못했어요. 이 기기에 저장된 카드를 보여 줘요.', true); } }
async function pushFav(op,id){ saveLocalFavs(); if(!CAVE) return;
  try{ const r=await fetch('/api/room',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op,code:CAVE,id})});
    if(!r.ok) throw new Error(r.status); applyRoomFavs((await r.json()).room); setSync(''); }
  catch(e){ setSync('굴에 저장하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.', true); } }

/* browse */
function pool(){ return CARDS.filter(c=> S.filter==='전체' || c.cat===S.filter); }
function pick(){ const p=pool(); let c; do{ c=p[Math.floor(Math.random()*p.length)]; } while(p.length>1 && S.current && c.id===S.current.id); return c; }
function renderCard(){ const cur=S.current; if(!cur) return; const meta=CATS[cur.cat];
  el('numeral').textContent=cur.roman; el('suitL').textContent=meta.glyph; el('suitR').textContent=meta.glyph;
  el('art').innerHTML=SYMBOLS[cur.sym]||SYMBOLS.star;
  el('art').classList.toggle('omen',cur.omen); el('art').parentElement.classList.toggle('omen',cur.omen); el('card').classList.toggle('omen',cur.omen);
  el('orig').textContent=cur.orig?'“'+cur.orig+'”':''; el('orig').style.display=cur.orig?'block':'none';
  el('arcana').innerHTML='<span class="kcat">'+cur.cat+'</span> · '+(cur.arc||meta.arcana);
  const order=[S.primary,...LANGS.filter(l=>l!==S.primary)];
  el('lines').className='lines'+(cur.lit?' lit':'');
  el('lines').innerHTML=order.map((lang,i)=>{const d=cur[lang];
    return '<div class="line lang-'+lang+' '+(i===0?'primary':'secondary')+'"><div class="txt">'+d.txt+'</div>'+(d.pron?'<div class="pron">'+d.pron+'</div>':'')+'</div>';}).join('');
  el('credit').textContent=cur.source?'— '+cur.source:'';
  const f=S.favs.some(x=>x.id===cur.id); el('fav').textContent=f?'♥':'♡'; el('fav').classList.toggle('on',f); }
function draw(){ const next=pick(); if(reduceMotion){S.current=next;renderCard();return;}
  const card=el('card'); card.classList.add('flip'); setTimeout(()=>{S.current=next;renderCard();},155); setTimeout(()=>{card.classList.remove('flip');},175); }
function renderFavs(){ const list=el('favList');
  if(S.favs.length===0){list.innerHTML='<div class="empty">♡를 누른 카드가 여기 모여요</div>';return;}
  list.innerHTML=''; S.favs.forEach((f,idx)=>{const it=document.createElement('div');it.className='fav-item';
    it.innerHTML='<span class="fn">'+f.roman+'</span><div class="ft"><div class="a">'+f[S.primary].txt+'</div><div class="b">'+f.ko.txt+' · '+f.zh.txt+' · '+f.en.txt+'</div></div><button class="rm">삭제</button>';
    it.addEventListener('click',e=>{if(e.target.classList.contains('rm'))return;S.current=f;renderCard();document.querySelector('.stage').scrollIntoView({behavior:'smooth',block:'center'});});
    it.querySelector('.rm').addEventListener('click',e=>{e.stopPropagation();S.favs.splice(idx,1);renderFavs();renderCard();pushFav('favRemove',f.id);});
    list.appendChild(it);}); }
function toggleFav(){const i=S.favs.findIndex(f=>f.id===S.current.id);const op=i>=0?'favRemove':'favAdd';if(i>=0)S.favs.splice(i,1);else S.favs.push(S.current);renderCard();renderFavs();pushFav(op,S.current.id);}
function buildCats(){const sel=el('cats');
  sel.innerHTML=['전체',...Object.keys(CATS)].map(n=>'<option value="'+n+'"'+(n===S.filter?' selected':'')+'>'+(n==='전체'?'모든 카드':n)+'</option>').join('');
  sel.addEventListener('change',()=>{S.filter=sel.value;draw();}); }

/* tutorial */
function openTut(i){ S.tutStep=i; el('tut').classList.remove('hidden'); renderTut(); }
function closeTut(){ el('tut').classList.add('hidden'); }
function renderTut(){ const s=TUT[S.tutStep];
  el('tutGlyph').textContent=s.g; el('tutTitle').textContent=s.t; el('tutBody').textContent=s.b;
  el('tutDots').innerHTML=TUT.map((_,i)=>'<i class="'+(i===S.tutStep?'on':'')+'"></i>').join('');
  el('tutNext').textContent = S.tutStep>=TUT.length-1 ? '시작하기' : '다음';
  el('tutSkip').style.visibility = S.tutStep>=TUT.length-1 ? 'hidden' : 'visible'; }
el('tutNext').addEventListener('click',()=>{ if(S.tutStep>=TUT.length-1) closeTut(); else openTut(S.tutStep+1); });
el('tutSkip').addEventListener('click',closeTut);

/* game */
function gamePool(){ const cats=S.litOn?EVERYDAY.concat(LIT):EVERYDAY; return CARDS.filter(c=>cats.includes(c.cat)); }
function listenerLang(){ return S.gp[S.speaker===1?2:1]; }
function speakerLang(){ return S.gp[S.speaker]; }
function clearTimer(){ if(S.timer){clearInterval(S.timer);S.timer=null;} }
function heartsRow(big){ let h=''; for(let i=0;i<S.total;i++) h+=(i<S.hearts?'♥':'<span class="off">♡</span>'); return '<div class="hearts'+(big?' big':'')+'">'+h+'</div>'; }
function pickGameCard(){ const p=gamePool(); let c; do{ c=p[Math.floor(Math.random()*p.length)]; } while(S.gcard && c.id===S.gcard.id); return c; }
function startGame(){ S.round=0; S.hearts=0; S.speaker=1; S.gcard=null; nextRound(); }
function nextRound(){ const d=DIFFS[S.diff]; S.gcard=pickGameCard(); const ll=listenerLang(); const correct=S.gcard[ll].txt;
  let distract=[]; const p=gamePool();
  if(d.same){ distract=sample(p.filter(c=>c.cat===S.gcard.cat),d.opt-1,[S.gcard]).map(c=>c[ll].txt); }
  if(distract.length<d.opt-1){ const more=sample(p,d.opt-1-distract.length,[S.gcard]).map(c=>c[ll].txt).filter(t=>t!==correct&&!distract.includes(t)); distract=distract.concat(more); }
  S.options=shuffle([{txt:correct,ok:true},...distract.slice(0,d.opt-1).map(t=>({txt:t,ok:false}))]);
  S.gview='speak'; renderGame(); }
function answer(i){ clearTimer(); S.picked=i; if(i>=0 && S.options[i].ok) S.hearts++; S.gview='reveal'; renderGame(); }
function startTimerUI(sec){ const num=el('tnum'),fill=el('tfill'); let left=sec;
  if(fill){ fill.style.transition='none'; fill.style.width='100%'; requestAnimationFrame(()=>{ fill.style.transition='width '+sec+'s linear'; fill.style.width='0%'; }); }
  S.timer=setInterval(()=>{ left--; if(num)num.textContent=Math.max(0,left); if(left<=0){ clearTimer(); answer(-1);} },1000); }

function diffSeg(){ return '<div class="g-seg" id="diffSeg">'+Object.keys(DIFFS).map(k=>'<button data-d="'+k+'" aria-pressed="'+(S.diff===k)+'">'+k+'</button>').join('')+'</div><div class="g-diffnote" id="diffNote">'+DIFFS[S.diff].desc+'</div>'; }
function langRow(who){ return '<div class="g-langrow"><span>'+who+'번 · Player '+who+'</span><div class="g-seg" data-who="'+who+'">'+LANGS.map(l=>'<button data-lang="'+l+'" aria-pressed="'+(S.gp[who]===l)+'">'+(l==='ko'?'한':l==='zh'?'中':'EN')+'</button>').join('')+'</div></div>'; }

function renderGame(){ clearTimer(); const st=el('gameStage'); const d=DIFFS[S.diff];
  if(S.gview==='setup'){
    st.innerHTML='<div class="g-panel panel">'+
      '<div class="g-title">둘의 언어를 골라요</div>'+
      langRow(1)+'<div class="g-vs">♥</div>'+langRow(2)+
      '<div class="g-sec">난이도</div>'+diffSeg()+
      '<button class="g-toggle" id="litTog" aria-pressed="'+S.litOn+'"><span class="box">'+(S.litOn?'✓':'')+'</span> 고전·문학·경고 카드 포함</button>'+
      '<button class="g-btn" id="gStart">게임 시작</button>'+
      '<button class="g-link" id="tutOpen">＋ 게임 방법 다시 보기</button>'+
    '</div>';
    st.querySelectorAll('.g-seg[data-who]').forEach(seg=>seg.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.gp[seg.dataset.who]=b.dataset.lang;[...seg.children].forEach(x=>x.setAttribute('aria-pressed',x===b));savePrefs();}));
    el('diffSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.diff=b.dataset.d;[...el('diffSeg').children].forEach(x=>x.setAttribute('aria-pressed',x===b));el('diffNote').textContent=DIFFS[S.diff].desc;savePrefs();});
    el('litTog').addEventListener('click',()=>{S.litOn=!S.litOn;el('litTog').setAttribute('aria-pressed',S.litOn);el('litTog').querySelector('.box').textContent=S.litOn?'✓':'';savePrefs();});
    el('gStart').addEventListener('click',startGame);
    el('tutOpen').addEventListener('click',()=>openTut(0));
    el('foot').textContent='둘이 폰 하나를 주고받으며 즐겨요'; return;
  }
  if(S.gview==='speak'){ const sl=speakerLang(); const dd=S.gcard[sl]; const meta=CATS[S.gcard.cat]; const om=S.gcard.omen?' omen':'';
    st.innerHTML='<div class="g-turnbar"><b>'+S.speaker+'번</b> · '+LANGLBL[sl]+'(으)로 읽어주세요</div>'+
      '<div class="panel'+om+'" style="width:100%;padding:14px 14px 16px;">'+
        '<div class="card-top"><span class="suit">'+meta.glyph+'</span><span class="numeral">'+S.gcard.roman+'</span><span class="suit">'+meta.glyph+'</span></div>'+
        '<div class="art-frame sm'+om+'"><svg class="art'+om+'" viewBox="0 0 100 100">'+(SYMBOLS[S.gcard.sym]||SYMBOLS.star)+'</svg></div>'+
        '<div class="arcana"><span class="kcat">'+S.gcard.cat+'</span> · '+(S.gcard.arc||meta.arcana)+'</div>'+
        (S.gcard.orig?'<div class="orig">“'+S.gcard.orig+'”</div>':'')+
        '<div class="speak-line lang-'+sl+(S.gcard.lit?' lit':'')+'"><div class="txt">'+dd.txt+'</div>'+(dd.pron?'<div class="pron">'+dd.pron+'</div>':'')+'</div>'+
        '<div class="speak-hint">상대에게 소리 내어 읽어주세요 🎭</div>'+
        (S.gcard.source?'<div class="credit">— '+S.gcard.source+'</div>':'')+
      '</div>'+
      '<button class="g-btn" id="gToGuess">상대가 맞힐 차례 →</button>'+heartsRow();
    el('gToGuess').addEventListener('click',()=>{S.gview='guess';renderGame();});
    el('foot').textContent='라운드 '+(S.round+1)+' / '+S.total+' · '+S.diff; return;
  }
  if(S.gview==='guess'){ const ll=listenerLang(); const other=S.speaker===1?2:1; const om=S.gcard.omen?' omen':'';
    const art = d.hide ? '<div class="back-q">?</div>' : '<svg class="art'+om+'" viewBox="0 0 100 100">'+(SYMBOLS[S.gcard.sym]||SYMBOLS.star)+'</svg>';
    st.innerHTML='<div class="g-turnbar"><b>'+other+'번</b> · 무슨 뜻일까요?</div>'+
      '<div class="panel" style="width:100%;padding:12px;"><div class="art-frame sm'+(d.hide?'':om)+'" style="margin:2px auto;">'+art+'</div></div>'+
      (d.time>0?'<div class="timer-wrap"><div class="tbar"><div class="tfill" id="tfill"></div></div><div class="tnum">⏳ <span id="tnum">'+d.time+'</span></div></div>':'')+
      '<div class="g-options" id="gOpts">'+S.options.map((o,i)=>'<button class="g-opt '+ll+'" data-i="'+i+'">'+o.txt+'</button>').join('')+'</div>'+heartsRow();
    el('gOpts').querySelectorAll('.g-opt').forEach(b=>b.addEventListener('click',()=>answer(+b.dataset.i)));
    if(d.time>0) startTimerUI(d.time);
    el('foot').textContent='라운드 '+(S.round+1)+' / '+S.total+' · '+S.diff; return;
  }
  if(S.gview==='reveal'){ const good=S.picked>=0 && S.options[S.picked].ok; let cls,msg;
    if(S.picked<0){cls='no';msg='시간 초과! 이런 뜻이었어요';} else if(good){cls='ok';msg='마음이 통했어요! ♥';} else {cls='no';msg='아쉬워요, 이런 뜻이었어요';}
    const om=S.gcard.omen?' omen':''; const meta=CATS[S.gcard.cat];
    st.innerHTML='<div class="g-turnbar '+cls+'">'+msg+'</div>'+
      '<div class="panel'+om+'" style="width:100%;padding:14px;">'+
        '<div class="art-frame sm'+om+'" style="margin:2px auto 8px;"><svg class="art'+om+'" viewBox="0 0 100 100">'+(SYMBOLS[S.gcard.sym]||SYMBOLS.star)+'</svg></div>'+
        '<div class="arcana"><span class="kcat">'+S.gcard.cat+'</span> · '+(S.gcard.arc||meta.arcana)+'</div>'+
        (S.gcard.orig?'<div class="orig">“'+S.gcard.orig+'”</div>':'')+
        ['ko','zh','en'].map(l=>'<div class="line lang-'+l+' secondary" style="padding:3px;"><div class="txt" style="font-size:15px;">'+S.gcard[l].txt+'</div></div>').join('')+
        (S.gcard.source?'<div class="credit">— '+S.gcard.source+'</div>':'')+
      '</div>'+
      '<button class="g-btn" id="gNext">'+(S.round+1>=S.total?'오늘의 궁합 보기 ✦':'다음 카드 →')+'</button>'+heartsRow();
    el('gNext').addEventListener('click',()=>{ S.round++; if(S.round>=S.total){S.gview='result';renderGame();} else {S.speaker=S.speaker===1?2:1;nextRound();} }); return;
  }
  if(S.gview==='result'){ const h=S.hearts,t=S.total; let title,en,sub;
    if(h>=t){title='운명의 짝';en='Soulmates';sub='말이 필요 없는 사이. 완벽하게 통했어요.';}
    else if(h>=t-2){title='천생연분';en='Meant to be';sub='마음이 거의 다 통해요. 조금만 더 알아가요.';}
    else if(h>=2){title='알아가는 중';en='Getting closer';sub='서로의 언어를 배우는 즐거움이 있네요.';}
    else{title='이제 시작';en='Just beginning';sub='괜찮아요, 함께 배우면 금방 통할 거예요.';}
    st.innerHTML='<div class="g-panel panel"><div class="r-title">'+title+'</div><div class="r-en">'+en+' · '+S.diff+'</div>'+heartsRow(true)+
      '<div class="r-score">'+t+'장 중 '+h+'번 마음이 통했어요</div><div class="r-sub">'+sub+'</div></div>'+
      '<button class="g-btn" id="gAgain">다시 하기</button><button class="g-btn ghost" id="gSetup">설정 다시 고르기</button>';
    el('gAgain').addEventListener('click',startGame); el('gSetup').addEventListener('click',()=>{S.gview='setup';renderGame();});
    el('foot').textContent='궁합은 재미로 즐겨요 ✦'; return;
  }
}

function setMode(m){ clearTimer(); S.mode=m;
  [...el('modebar').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===m));
  el('browseView').classList.toggle('hidden',m!=='browse'); el('gameView').classList.toggle('hidden',m!=='game');
  if(m==='game'){ if(S.round===0&&S.gview!=='setup')S.gview='setup'; renderGame(); if(!S.tutSeen){S.tutSeen=true; savePrefs(); openTut(0);} }
  else el('foot').textContent=''; }
el('modebar').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setMode(b.dataset.mode);});
el('segment').addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;S.primary=btn.dataset.lang;[...el('segment').children].forEach(b=>b.setAttribute('aria-pressed',b===btn));savePrefs();renderCard();renderFavs();});
el('card').addEventListener('click',e=>{if(e.target.id==='fav')return;draw();});
el('card').addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();draw();}});
el('fav').addEventListener('click',e=>{e.stopPropagation();toggleFav();});
[...el('segment').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===S.primary));
loadLocalFavs(); buildCats(); S.current=pick(); renderCard(); renderFavs(); setSync('');
pullFavs();
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && S.mode==='browse') pullFavs(); });
setInterval(()=>{ if(!document.hidden && S.mode==='browse') pullFavs(); }, 20000);
</script>
